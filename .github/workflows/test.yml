name: test
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'config/**'
      - 'packages/**'
      - 'test/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests
        run: pnpm run test
